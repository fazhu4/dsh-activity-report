# dsh-usage-insights bundle patch layer — installed automatically when this
# package is added as a bundle (dsh plugin --profile web add dsh-usage-insights).
- insert:
    - id: dsh-usage-insights
      name: 'dsh-usage-insights'
      inject: ['webServer', 'sessionQuery', 'sessions', 'storageDomain']
      config:
        persistDebounceMs: 1000
        backfillConcurrency: 4
        defaultPageSize: 25
        timezone: !!js Intl.DateTimeFormat().resolvedOptions().timeZone
